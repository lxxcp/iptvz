name: zubo2

on:
  schedule:
    - cron: '25 3 * * *'   # UTC 03:25 = 北京 11:25
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yt-dlp sed nmap netcat-openbsd curl

      - name: 测试组播源（全部城市）
        env:
          TZ: Asia/Shanghai
          CITY_JOBS: '3'     # 城市级并发：同时跑 3 个城市
          SPEED_JOBS: '5'    # 单城市内测速并发
          NC_JOBS: '50'      # 单城市内连通性检测并发
        run: |
          cd "$GITHUB_WORKSPACE"
          chmod +x zubo.sh

          # 跑全部 71 个城市（脚本内部会并发 + 合并 zubo.txt）
          bash ./zubo.sh 0

          # 保险起见，再手动合并一次（防止脚本内合并被跳过）
          time=$(date +"%Y/%m/%d %H:%M:%S")
          {
            echo "组播源 $time 更新,#genre#"
            for f in $(ls txt/*.txt 2>/dev/null | grep -v '/zubo\.txt$' | sort); do
              cat "$f"
            done
          } > zubo.txt

          echo "===== 生成的城市文件 ====="
          ls -la txt/
          echo "===== zubo.txt 行数 ====="
          wc -l zubo.txt

      - name: 更新组播源
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --cached --quiet && echo "无变化" && exit 0
          git commit -m "更新组播源 $(date +'%Y-%m-%d %H:%M:%S')"
          git push