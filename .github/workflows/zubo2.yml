name: zubo2

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yt-dlp sed nmap
        
      - name: 测试组播源
        run: |
          cd $GITHUB_WORKSPACE
          bash ./zubo.sh
          time=$(date +%Y/%m/%d)
          echo "浙江频道 $time 更新,#genre#" > zubo.txt
          # 先添加浙江的源（如果存在）
          if [ -f txt/浙江.txt ]; then
              cat txt/浙江.txt >> zubo.txt
          fi
          # 再添加其他所有txt文件（排除浙江.txt，避免重复）
          for file in txt/*.txt; do
              if [ "$(basename "$file")" != "浙江.txt" ]; then
                  cat "$file" >> zubo.txt
              fi
          done

      - name: 更新组播源
        run: |
          git pull
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "更新组播源"
          git push